<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="diaph-t diaph-d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="diaph-t">What the diaphragm does when you breathe</title><desc id="diaph-d">Two panels. Breathing in: the dome-shaped diaphragm moves down and the lungs fill. Breathing out: the diaphragm moves up and air leaves the lungs.</desc><rect width="900" height="450" rx="28" fill="#10122a"/><text x="235" y="58" fill="#f4f1fb" font-size="30" font-weight="700" text-anchor="middle">Breathing in</text><path d="M213 100C100 90 70 265 100 317L223 295Z" fill="#3a2f5c" stroke="#8d78c9" stroke-width="3"/><path d="M257 100C370 90 400 265 370 317L247 295Z" fill="#3a2f5c" stroke="#8d78c9" stroke-width="3"/><path d="M85 335C145 291 325 291 385 335" stroke="#f5a681" stroke-width="11" fill="none" stroke-linecap="round"/><path d="M235 345L235 391" stroke="#f5a681" stroke-width="6" stroke-linecap="round"/><path d="M224 380L235 391L246 380" stroke="#f5a681" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="235" y="420" fill="#b9b6d3" font-size="21" text-anchor="middle">Diaphragm moves down, chest grows</text><text x="665" y="58" fill="#f4f1fb" font-size="30" font-weight="700" text-anchor="middle">Breathing out</text><path d="M643 100C567 90 537 185 567 237L653 215Z" fill="#3a2f5c" stroke="#8d78c9" stroke-width="3"/><path d="M687 100C763 90 793 185 763 237L677 215Z" fill="#3a2f5c" stroke="#8d78c9" stroke-width="3"/><path d="M515 255C575 211 755 211 815 255" stroke="#f5a681" stroke-width="11" fill="none" stroke-linecap="round"/><path d="M665 311L665 265" stroke="#f5a681" stroke-width="6" stroke-linecap="round"/><path d="M654 276L665 265L676 276" stroke="#f5a681" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="665" y="420" fill="#b9b6d3" font-size="21" text-anchor="middle">Diaphragm moves up, air leaves</text></svg>