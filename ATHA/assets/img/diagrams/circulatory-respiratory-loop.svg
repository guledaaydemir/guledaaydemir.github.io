<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" role="img" aria-labelledby="circ-t circ-d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="circ-t">How the circulatory and respiratory systems connect</title><desc id="circ-d">Loop diagram. Oxygen-poor blood travels from the body through the veins to the right side of the heart, then through the pulmonary artery to the lungs. Oxygen-rich blood returns through the pulmonary veins to the left side of the heart, then through the aorta and arteries to the body.</desc><rect width="900" height="740" rx="28" fill="#10122a"/><defs><marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#ef6f6c"/></marker><marker id="ab" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#6fa8ff"/></marker></defs><rect x="250" y="40" width="400" height="120" rx="22" fill="#3a2f5c" stroke="#8d78c9" stroke-width="2.4"/><text x="450.0" y="96.0" fill="#f4f1fb" font-size="27" font-weight="700" text-anchor="middle">Lungs</text><text x="450.0" y="126.0" fill="#b9b6d3" font-size="20" text-anchor="middle">blood drops CO&#8322;, picks up O&#8322;</text><rect x="250" y="290" width="190" height="130" rx="22" fill="#232546" stroke="#8d78c9" stroke-width="2.4"/><text x="345.0" y="351.0" fill="#f4f1fb" font-size="27" font-weight="700" text-anchor="middle">Right heart</text><text x="345.0" y="381.0" fill="#b9b6d3" font-size="20" text-anchor="middle">pumps to lungs</text><rect x="460" y="290" width="190" height="130" rx="22" fill="#232546" stroke="#8d78c9" stroke-width="2.4"/><text x="555.0" y="351.0" fill="#f4f1fb" font-size="27" font-weight="700" text-anchor="middle">Left heart</text><text x="555.0" y="381.0" fill="#b9b6d3" font-size="20" text-anchor="middle">pumps to body</text><rect x="250" y="550" width="400" height="120" rx="22" fill="#3a2f5c" stroke="#8d78c9" stroke-width="2.4"/><text x="450.0" y="606.0" fill="#f4f1fb" font-size="27" font-weight="700" text-anchor="middle">Body</text><text x="450.0" y="636.0" fill="#b9b6d3" font-size="20" text-anchor="middle">cells use O&#8322;, make CO&#8322;</text><path d="M345 280L345 174" stroke="#6fa8ff" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#ab)"/><path d="M555 170L555 276" stroke="#ef6f6c" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#ar)"/><path d="M555 430L555 536" stroke="#ef6f6c" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#ar)"/><path d="M345 540L345 434" stroke="#6fa8ff" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#ab)"/><text x="330" y="232" fill="#6fa8ff" font-size="21" font-weight="600" text-anchor="end">Pulmonary artery</text><text x="570" y="232" fill="#ef6f6c" font-size="21" font-weight="600">Pulmonary veins</text><text x="570" y="490" fill="#ef6f6c" font-size="21" font-weight="600">Aorta and arteries</text><text x="330" y="490" fill="#6fa8ff" font-size="21" font-weight="600" text-anchor="end">Veins, vena cava</text><text x="450" y="714" fill="#b9b6d3" font-size="20" text-anchor="middle"><tspan fill="#6fa8ff">Blue: oxygen-poor blood</tspan>  &#183;  <tspan fill="#ef6f6c">Red: oxygen-rich blood</tspan></text></svg>